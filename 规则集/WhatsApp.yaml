  - DOMAIN-SUFFIX,whatsapp.cl  # 智利业务
  - DOMAIN-SUFFIX,whatsapp.com.ar  # 阿根廷业务

  ## 欧洲业务
  - DOMAIN-SUFFIX,whatsapp.de  # 德国业务
  - DOMAIN-SUFFIX,whatsapp.fr  # 法国业务
