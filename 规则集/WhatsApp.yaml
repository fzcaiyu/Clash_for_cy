  # WhatsApp 全球核心服务域名
  ## 主要服务域名
  - DOMAIN-KEYWORD,whatsapp  # WhatsApp 平台关键词匹配
  - DOMAIN-SUFFIX,whatsapp.com  # WhatsApp 主站点域名
  - DOMAIN-SUFFIX,whatsapp.net  # WhatsApp 网络服务域名
  - DOMAIN-SUFFIX,whatsapp.org  # WhatsApp 组织域名
  - DOMAIN-SUFFIX,whatsappbusiness.com  # WhatsApp 商业版域名

  # WhatsApp 全球业务域名
  ## 北美洲业务
  - DOMAIN-SUFFIX,whatsapp.ca  # 加拿大业务
  - DOMAIN-SUFFIX,whatsapp.us  # 美国业务
  - DOMAIN-SUFFIX,whatsapp.com.mx  # 墨西哥业务

  ## 南美洲业务
