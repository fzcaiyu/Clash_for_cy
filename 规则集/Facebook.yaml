  # 设备和系统全面支持
  ## Android 系统
  - PROCESS-NAME,com.facebook.katana  # Facebook Android 主应用
  - PROCESS-NAME,com.facebook.orca  # Facebook Messenger Android 应用
  - BUNDLE-ID,com.facebook.katana  # Android 应用标识
