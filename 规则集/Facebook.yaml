  - DOMAIN-SUFFIX,googleplay.com  # 应用分发平台

  ## iOS 系统
  - PROCESS-NAME,Facebook  # Facebook iOS 应用
  - PROCESS-NAME,Messenger  # Facebook Messenger iOS 应用
  - BUNDLE-ID,com.facebook.Facebook  # iOS 应用标识
  - DOMAIN-SUFFIX,apple.com  # Apple 系统域名
